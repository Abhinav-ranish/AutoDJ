[package]
name = "autodj-app"
version = "0.1.0"
edition = "2021"

[dependencies]
autodj-core = { path = "../autodj-core" }
autodj-storage = { path = "../autodj-storage" }
autodj-analysis = { path = "../autodj-analysis" }
autodj-ai = { path = "../autodj-ai" }

tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
lofty = "0.21"
cpal = "0.15"
dotenvy = "0.15.7"
reqwest = { workspace = true }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
urlencoding = "2.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "autodj_app"
crate-type = ["staticlib", "cdylib", "rlib"]
