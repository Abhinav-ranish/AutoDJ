[workspace]
members = [
    "crates/autodj-core",
    "crates/autodj-storage",
    "crates/autodj-analysis",
    "crates/autodj-ai",
    "crates/autodj-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
